<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bauome WhatsApp</title>
    <!-- استدعاء خط كايرو وأيقونات فونت أوسم الاحترافية -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --dark-bg: #111b21;
            --sidebar-bg: #111b21;
            --chat-bg: #0b141a;
            --panel-bg: #202c33;
            --whatsapp-green: #00a884;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --bubble-out: #005c4b;
            --border-color: #222e35;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Cairo', sans-serif; 
        }
        
        body { 
            background-color: #0b141a; 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
        }
        
        .app-container { 
            display: flex; 
            width: 100%; 
            height: 100vh; 
        }

        /* القائمة الجانبية للأصدقاء */
        .sidebar { 
            width: 35%; 
            max-width: 400px; 
            min-width: 280px; 
            border-left: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            background-color: var(--sidebar-bg); 
        }
        
        .sidebar-header { 
            height: 60px; 
            background-color: var(--panel-bg); 
            padding: 10px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .user-avatar { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            background-color: var(--whatsapp-green); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold; 
            color: #fff; 
        }
        
        .add-friend-btn { 
            background: none; 
            border: none; 
            color: var(--whatsapp-green); 
            font-size: 16px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: bold; 
        }
        
        .chat-list { 
            flex: 1; 
            overflow-y: auto; 
        }
        
        .chat-item { 
            display: flex; 
            padding: 12px 16px; 
            border-bottom: 1px solid var(--border-color); 
            cursor: pointer; 
            transition: 0.2s; 
            align-items: center; 
        }
        
        .chat-item:hover, .chat-item.active { 
            background-color: var(--panel-bg); 
        }
        
        .chat-avatar { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            background-color: #53616b; 
            margin-left: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 18px; 
            color: #fff; 
        }
        
        .chat-info { 
            flex: 1; 
        }
        
        .chat-name { 
            font-weight: 600; 
            font-size: 15px; 
            display: block; 
            color: var(--text-main);
        }
        
        .chat-phone { 
            font-size: 12px; 
            color: var(--text-muted); 
        }

        /* منطقة المحادثة */
        .chat-window { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background-color: var(--chat-bg); 
            position: relative; 
        }
        
        /* الخلفية المنقوشة الشهيرة لواتساب */
        .chat-window::before { 
            content: ""; 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0.04; 
            background-image: url('https://githubusercontent.com'); 
            pointer-events: none; 
        }
        
        .chat-header { 
            height: 60px; 
            background-color: var(--panel-bg); 
            padding: 10px 16px; 
            display: flex; 
            align-items: center; 
            z-index: 1; 
            border-bottom: 1px solid var(--border-color); 
        }
        
        .current-chat-name { 
            font-weight: 600; 
            margin-right: 12px; 
            font-size: 16px; 
        }
        
        /* شاشة الترحيب */
        .welcome-screen { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            color: var(--text-muted); 
            z-index: 1; 
            padding: 20px;
        }
        
        .welcome-screen i { 
            font-size: 80px; 
            color: #202c33; 
            margin-bottom: 20px; 
        }

        .messages-container { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            z-index: 1; 
            display: none; 
            flex-direction: column; 
            justify-content: flex-start; 
        }
        
        .welcome-msg { 
            background-color: #182229; 
            padding: 15px; 
            border-radius: 8px; 
            text-align: center; 
            max-width: 90%; 
            align-self: center; 
            color: var(--text-muted); 
            border: 1px solid var(--border-color); 
            font-size: 14px;
        }

        /* شريط الإدخال السفلي */
        .chat-input-bar { 
            height: 62px; 
            background-color: var(--panel-bg); 
            padding: 5px 16px; 
            display: none; 
            align-items: center; 
            gap: 15px; 
            z-index: 1; 
        }
        
        .input-wrapper { 
            flex: 1; 
        }
        
        .input-wrapper input { 
            width: 100%; 
            height: 42px; 
            background-color: #2a3942; 
            border: none; 
            outline: none; 
            border-radius: 8px; 
            padding: 0 15px; 
            color: var(--text-main); 
            font-size: 15px; 
        }
        
        .send-btn { 
            background: transparent; 
            border: none; 
            cursor: pointer; 
            color: var(--whatsapp-green); 
            font-size: 22px; 
        }

        /* تعديلات لتناسب الشاشات الصغيرة والموبايل */
        @media (max-width: 768px) {
            .sidebar { width: 100%; max-width: none; }
            .chat-window { display: none; width: 100%; }
            .chat-window.active-window { display: flex; }
            .sidebar.hidden-sidebar { display: none; }
            .back-btn { display: block !important; margin-right: 10px; cursor: pointer; font-size: 20px; color: var(--text-muted); }
        }
        
        .back-btn { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- القائمة الجانبية -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-avatar">B</div>
                <button class="add-friend-btn" onclick="addNewFriend()">
                    <i class="fa-solid fa-user-plus"></i> إضافة صديق
                </button>
            </div>
            <div class="chat-list" id="chatList">
                <!-- الأصدقاء يضافون هنا عبر الـ JavaScript -->
            </div>
        </div>

        <!-- شاشة المحادثة الرئيسية -->
        <div class="chat-window" id="chatWindow">
            <!-- شاشة الترحيب الافتراضية -->
            <div class="welcome-screen" id="welcomeScreen">
                <i class="fa-brands fa-whatsapp"></i>
                <h2>Bauome WhatsApp</h2>
                <p>أضف صديقاً وابدأ المراسلة الفورية عبر واتساب الحقيقي.</p>
            </div>

            <!-- هيدر الشات -->
            <div class="chat-header" id="chatHeader" style="display: none;">
                <i class="fa-solid fa-arrow-right back-btn" onclick="backToSidebar()"></i>
                <div class="chat-avatar" style="width: 38px; height: 38px; margin-left: 10px;"><i class="fa-solid fa-user"></i></div>
                <div>
                    <div class="current-chat-name" id="currentChatName">اسم الصديق</div>
                </div>
            </div>

            <!-- منطقة الرسائل التنبيهية -->
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-msg">
                    🔒 نظام الربط المباشر نشط. عند كتابة الرسالة والضغط على إرسال، سيفتح التطبيق الرسمي لإرسالها فوراً.
                </div>
            </div>

            <!-- شريط الكتابة -->
            <div class="chat-input-bar" id="chatInputBar">
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="اكتب رسالة...">
                </div>
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let friends = [];
        let activeFriendIndex = null;

        // دالة إضافة صديق جديد
        function addNewFriend() {
            let name = prompt("أدخل اسم الصديق:");
            if (!name) return;
            
            let phone = prompt("أدخل رقم الهاتف بكود الدولة (مثال لمصر: 2010xxxxxxxx):");
            if (!phone) return;

            // تنظيف الرقم من الرموز والمسافات
